<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Прототип вет-приложения</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone mockup (light wireframe, fixed palette) beside a scenario panel; stacks on phones. */
:root{
  --page:#E9ECEF; --page-fg:#16191D; --page-mut:#545B63; --panel:#F7F8F9; --line:#CDD2D8; --bezel:#111316;
  --focus:#2F6BDF; --live:#E0483D; --scrim:rgba(20,18,24,.55);
  --f-ui:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --s:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#101215;--page-fg:#E6E9EC;--page-mut:#A2A9B1;--panel:#181B1F;--line:#2C3137;--bezel:#000000;color-scheme:dark}}
:root[data-theme="dark"]{--page:#101215;--page-fg:#E6E9EC;--page-mut:#A2A9B1;--panel:#181B1F;--line:#2C3137;--bezel:#000000;color-scheme:dark}

body{background:var(--page);color:var(--page-fg);font-family:var(--f-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start;justify-content:center}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button{font:inherit;color:inherit}

/* ---------- app themes (from the light / dark samples) ---------- */
.phone[data-th="light"]{
  --ph-bg:#DFD0BB; --surf:#F5EDE1; --sheet:#F5EDE1; --sheet-surf:#FFFAF2;
  --g-ink:#45444B; --g-ink2:#54525A; --g-ink3:#5F5B58; --g-hair:rgba(69,68,75,.18); --g-line:rgba(69,68,75,.35);
  --s-ink:#3E3D44; --s-ink2:#4F4D55; --s-ink3:#625E5B; --s-hair:#DCCDB8;
  --ink:#3E3D44; --ink-2:#4F4D55; --ink-3:#625E5B; --ink-on:#4F4D55; --hair:#DCCDB8; --bd:#C4B196;
  --fill:#EADFCF; --fill-2:#D6C6AE; --acc-pale:#E8D8BF;
  --acc:#8B6D4F; --acc-h:#7C6146; --acc-d:#8B6D4F; --on-acc:#FFF8EE; --acc-ring:rgba(139,109,79,.28);
  --red:#A82828; --rec:#A82828; --on-red:#FFFFFF; --red-40:rgba(168,40,40,.4);
  --dk:#45444B; --on-dk:#F5EDE1; --hl:#F6E3C3; --hl-a:rgba(139,109,79,.22);
  --warn:#F2BE93; --warn-bg:#FBEBDD; --warn-line:#CF8448; --ok:#DCE8D2;
}
.phone[data-th="dark"]{
  --ph-bg:#56555B; --surf:#64636A; --sheet:#4A494F; --sheet-surf:#5C5B61;
  --g-ink:#D6BE99; --g-ink2:#D9C6A8; --g-ink3:#CDBFAA; --g-hair:rgba(214,190,153,.2); --g-line:rgba(214,190,153,.45);
  --s-ink:#F1E9DC; --s-ink2:#E6DCCC; --s-ink3:#D2C7B7; --s-hair:#76757C;
  --ink:#F1E9DC; --ink-2:#E6DCCC; --ink-3:#D2C7B7; --ink-on:#E6DCCC; --hair:#76757C; --bd:#7E7D84;
  --fill:#5E5D63; --fill-2:#75747B; --acc-pale:#6E6D75;
  --acc:#6B8FB0; --acc-h:#7B9DBC; --acc-d:#8FB0CF; --on-acc:#14171C; --acc-ring:rgba(107,143,176,.35);
  --red:#A82828; --rec:#E07A72; --on-red:#FFFFFF; --red-40:rgba(168,40,40,.4);
  --dk:#2C2B30; --on-dk:#F1E9DC; --hl:#7A6E5E; --hl-a:rgba(214,190,153,.22);
  --warn:#E5A47A; --warn-bg:#6E5446; --warn-line:#E5A47A; --ok:#4F6650;
}

/* ---------- side panel ---------- */
.side{flex:1 1 300px;max-width:400px;min-width:0;display:flex;flex-direction:column;gap:24px;padding-top:12px}
.side h1{margin:0;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.side p{margin:0;color:var(--page-mut);font-size:15px;line-height:1.55}
.grp{display:flex;flex-direction:column;gap:8px}
.grp h2{margin:0;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--page-mut)}
.sbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--page-fg);font-size:15px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s,color .15s}
.sbtn:hover{border-color:var(--page-fg)}
.sbtn[aria-pressed="true"]{background:var(--page-fg);color:var(--page);border-color:var(--page-fg)}
.sbtn small{font-size:12px;color:inherit;opacity:.7}
.jumps{display:flex;flex-wrap:wrap;gap:8px}
.jbtn{min-height:38px;padding:0 13px;border-radius:19px;border:1px solid var(--line);background:var(--panel);color:var(--page-fg);font-size:14px;cursor:pointer}
.jbtn:hover{border-color:var(--page-fg)}

/* ---------- phone ---------- */
.phonebox{width:calc(412px * var(--s));height:calc(866px * var(--s));flex:none}
.phone{box-sizing:content-box;width:390px;height:844px;border:11px solid var(--bezel);border-radius:56px;background:var(--ph-bg);overflow:hidden;position:relative;transform:scale(var(--s));transform-origin:top left;box-shadow:0 40px 70px -30px rgba(0,0,0,.45);color:var(--ink);font-size:15px}
.phone::before{content:"";position:absolute;top:11px;left:50%;width:112px;height:30px;margin-left:-56px;border-radius:16px;background:var(--bezel);z-index:60}
.app{position:absolute;inset:0;display:flex;flex-direction:column;border-radius:45px;overflow:hidden}
.stage{flex:1;position:relative;overflow:hidden;min-height:0}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--ph-bg)}
.ovr{position:absolute;inset:0;pointer-events:none;z-index:40}
.ovr > *{pointer-events:auto}

.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:52px 20px 10px}
.hd-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.bk{display:inline-flex;align-items:center;gap:2px;font-size:15px;color:var(--ink-2);background:none;border:0;padding:0;min-height:32px;cursor:pointer;align-self:flex-start}
.h1{margin:0;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{width:44px;height:44px;flex:none;border-radius:50%;border:1.5px solid var(--ink);background:var(--ph-bg);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.me:active{transform:scale(.93)}
.me.on{background:var(--ink);color:var(--ph-bg);cursor:default}
.bd{flex:1;min-height:0;overflow-y:auto;padding:8px 20px 20px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.bd::-webkit-scrollbar{display:none}
.bd.center{align-items:center;justify-content:center;text-align:center;gap:14px}

.s{font-size:13px;color:var(--ink-3);line-height:1.4}
.c{text-align:center}
.lbl{font-size:12px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.lblrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sect{display:flex;flex-direction:column;gap:8px}
.col{display:flex;flex-direction:column;gap:14px}
.tx{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0;text-align:left}
.lnk{background:none;border:0;padding:0 2px;min-height:40px;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;color:var(--ink)}
.tag{display:inline-flex;align-items:center;padding:4px 10px;border-radius:12px;background:var(--fill-2);font-size:12px;font-weight:600;color:var(--ink)}
.tag.dark{background:var(--ink);color:var(--ph-bg)}
.tag.dash{background:none;border:1.5px dashed var(--ink)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

.tile{display:flex;align-items:center;gap:16px;min-height:88px;padding:16px 20px;border-radius:20px;border:1.5px solid var(--ink);background:var(--ph-bg);cursor:pointer;transition:transform .15s}
.tile:active{transform:scale(.98)}
.tile.pri{background:var(--ink);color:var(--ph-bg);min-height:118px}
.tile .t{font-size:18px;font-weight:700}
.tile .t.big{font-size:21px}
.tile.pri .s{color:var(--ink-on)}
.ring{width:56px;height:56px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;flex:none}
.draftrow{display:flex;align-items:center;gap:12px;min-height:64px;padding:0 16px;border-radius:16px;border:1.5px dashed var(--ink);background:var(--ph-bg);cursor:pointer}
.draftrow b{font-size:16px;font-weight:600}
.draftrow .lnkt{font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 16px;border-radius:14px;border:1.5px solid var(--ink);background:var(--ph-bg);color:var(--ink);font-size:16px;font-weight:600;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--ph-bg)}
.btn.dash{border-style:dashed}
.btn.ghost{border-color:transparent;color:var(--ink-2);min-height:44px}
.btn.sm{min-height:50px;font-size:15px}
.btn.auto{align-self:center;padding:0 24px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid3 .btn{padding:0 6px;font-size:14px;gap:4px;min-height:48px}

.tplbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:0 16px;border-radius:14px;border:1.5px solid var(--ink);background:var(--ph-bg);cursor:pointer;flex:none}
.tplbtn b{font-size:17px;font-weight:700}
.tplbtn .ch{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--ink-2)}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;min-height:64px;margin:0 -8px;padding:0 8px;border:0;border-bottom:1px solid var(--hair);background:none;text-align:left;cursor:pointer;border-radius:0}
.row.static{cursor:default}
.row.tight{min-height:56px}
.row b{font-size:16px;font-weight:600}
.row .end{font-size:14px;font-weight:600}
.row.fresh{animation:fresh 2.6s ease-out}
@keyframes fresh{0%,45%{background:var(--fill-2)}100%{background:transparent}}
.av{width:44px;height:44px;border-radius:50%;background:var(--fill-2);display:grid;place-items:center;font-weight:700;color:var(--ink-2);flex:none}
.num{font-variant-numeric:tabular-nums}

.field{display:flex;align-items:center;gap:8px;min-height:46px;padding:0 14px;border-radius:14px;border:1.5px solid var(--hair);color:var(--ink-3);flex:none}
.field:focus-within{border-color:var(--ink)}
.field input{border:0;outline:0;flex:1;min-width:0;font:inherit;font-size:15px;color:var(--ink);background:transparent}
.inp{width:100%;box-sizing:border-box;min-height:48px;padding:0 14px;border-radius:14px;border:1.5px solid var(--hair);font:inherit;font-size:15px;color:var(--ink);background:var(--ph-bg)}
.inp:focus{border-color:var(--ink);outline:0}
textarea.inp{padding:12px 14px;min-height:110px;resize:none;line-height:1.45}
.fl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.fl.grow{flex:1;min-height:150px}
.fl.grow textarea{flex:1}
.err{font-size:14px;color:var(--rec);font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:19px;border:1.5px solid var(--ink);background:var(--ph-bg);font-size:14px;cursor:pointer;transition:background .2s,color .2s}
.chip.on{background:var(--ink);color:var(--ph-bg)}

.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:4px;border-radius:16px;border:1.5px solid var(--ink);position:relative;flex:none}
.seg button{position:relative;z-index:1;min-height:44px;border:0;background:none;font-weight:600;font-size:14px;cursor:pointer;transition:color .25s;border-radius:12px}
.seg button.on{color:var(--ph-bg)}
.seg .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:12px;background:var(--ink);transition:transform .32s cubic-bezier(.22,.8,.24,1)}
.seg.r .ind{transform:translateX(100%)}
.secrow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:0 6px 0 14px;border-radius:12px;background:var(--fill);font-size:15px}
/* 4-step flow */
.stepper{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;flex:none;position:relative}
.stepper li{display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;font-size:11px;color:var(--ink-3);text-align:center}
.stepper li:not(:last-child)::after{content:"";position:absolute;top:13px;left:calc(50% + 17px);right:calc(-50% + 17px);height:1.5px;background:var(--hair)}
.stepper li.done:not(:last-child)::after{background:var(--ink)}
.stepper .sn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--hair);display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--ph-bg);color:var(--ink-3);transition:background .3s,border-color .3s,color .3s}
.stepper li.done .sn{background:var(--ink);border-color:var(--ink);color:var(--ph-bg)}
.stepper li.now .sn{border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 3px var(--fill-2)}
.stepper li.now,.stepper li.done{color:var(--ink)}
.stepper li.now .sl{font-weight:700}
.hint{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:14px;background:var(--warn-bg);font-size:14px;line-height:1.4;flex:none;transition:background .3s}
.hint svg{flex:none;margin-top:1px}
.hint.ok{background:var(--ok)}
.tag.warn{background:var(--warn);color:var(--ink);margin-left:8px}
.rlab{display:flex;align-items:center}
.rflag .inp{border-color:var(--warn-line);background:var(--warn-bg)}
.rsec{border-radius:14px;padding:4px;margin:-4px}
.rta{min-height:84px}
.rnote{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:-2px}
.upl{display:flex;align-items:center;gap:14px;min-height:72px;padding:12px 16px;border-radius:16px;border:1.5px dashed var(--ink);background:var(--fill);cursor:pointer;transition:background .2s}
.upl:hover{background:var(--fill-2)}
.upl b{font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spin.sm{width:26px;height:26px;border-width:3px;flex:none}
.ib{width:40px;height:40px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);border-radius:10px}

/* recording */
.recz{flex:1 0 auto;min-height:290px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.bigbtn{width:132px;height:132px;border-radius:50%;background:var(--ink);color:var(--ph-bg);border:0;display:grid;place-items:center;cursor:pointer;position:relative;transition:transform .15s;flex:none}
.bigbtn:active{transform:scale(.95)}
.bigbtn.mid{width:88px;height:88px}
.bigbtn.stop{background:var(--ph-bg);border:3px solid var(--ink)}
.bigbtn.stop i{width:44px;height:44px;border-radius:9px;background:var(--ink)}
.bigbtn.live::before,.bigbtn.live::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--ink);animation:ring 1.8s ease-out infinite;pointer-events:none}
.bigbtn.live::after{animation-delay:.9s}
@keyframes ring{from{transform:scale(1);opacity:.55}to{transform:scale(1.5);opacity:0}}
.rl{font-size:17px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:20px;border:1.5px solid var(--ink);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.pill.dark{background:var(--ink);color:var(--ph-bg)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--rec);animation:blink 1.1s ease-in-out infinite}
.sq{width:10px;height:10px;border-radius:2px;background:var(--ph-bg)}
@keyframes blink{50%{opacity:.25}}
.wave{display:flex;align-items:center;gap:5px;height:58px}
.wave i{width:5px;border-radius:3px;background:var(--ink);height:10px;animation:wv .9s ease-in-out infinite}
@keyframes wv{0%,100%{height:8px}50%{height:var(--h)}}
.recrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--hair);align-self:stretch;position:relative;overflow:hidden;flex:none}
.recrow b{font-size:16px;font-weight:600}
.playbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:var(--ph-bg);display:grid;place-items:center;cursor:pointer;flex:none}
.prog{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--ink)}
.recrow.playing .prog{animation:prog 3s linear forwards}
@keyframes prog{to{width:100%}}
.lnkbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;border:0;background:none;font-size:15px;font-weight:600;cursor:pointer}

/* photos */
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.th{width:66px;height:66px;border-radius:12px;background:linear-gradient(135deg,var(--fill-2),var(--fill));display:grid;place-items:center;color:var(--ink-3)}
.addth{width:66px;height:66px;border-radius:12px;border:1.5px dashed var(--ink);background:var(--ph-bg);display:grid;place-items:center;cursor:pointer}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tgrid .th{width:auto;height:auto;aspect-ratio:1;max-width:100%}
.drop{flex:1;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-radius:20px;border:2px dashed var(--ink);background:var(--ph-bg);cursor:pointer;transition:background .2s}
.drop:active{background:var(--fill)}
.drop b{font-size:20px}
.plusc{width:88px;height:88px;border-radius:50%;background:var(--ink);color:var(--ph-bg);display:grid;place-items:center}
.banner{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--fill);font-size:15px;font-weight:600;flex:none}
.banner .th{width:44px;height:44px;border-radius:9px}

/* calc */
.disp{min-height:100px;border-radius:18px;border:1.5px solid var(--hair);padding:10px 16px;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;gap:2px;flex:none;overflow:hidden}
.disp .expr{font-size:15px;color:var(--ink-3);min-height:20px;font-variant-numeric:tabular-nums}
.disp output{font-size:46px;font-weight:300;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.disp output.small{font-size:32px}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;flex:none}
.k{min-height:60px;border-radius:18px;border:1.5px solid var(--ink);background:var(--ph-bg);font-size:23px;cursor:pointer;transition:transform .08s,background .15s,color .15s}
.k:active{transform:scale(.93)}
.k.fn{background:var(--fill)}
.k.op{background:var(--fill-2)}
.k.op.act,.k.eq{background:var(--ink);color:var(--ph-bg)}
.k.z{grid-column:span 2}
.dose{margin-top:auto;flex:none}

/* dosage */
.voice{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 16px;border-radius:20px;border:1.5px solid var(--ink);flex:none}
.voice b{font-size:16px;font-weight:600}
.or{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:13px}
.or i{flex:1;height:1px;background:var(--hair)}
.res{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:14px;background:var(--fill)}
.res b{font-size:18px}

/* profile */
.who{display:flex;align-items:center;gap:14px}
.who .av{width:60px;height:60px;font-size:22px}
.who b{font-size:20px}
.arow{display:flex;align-items:center;gap:12px;min-height:58px;border-bottom:1px solid var(--hair)}
.arow b{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subbox{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:16px;border:1.5px solid var(--ink)}
.subbox .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.subbox .top b{font-size:17px}

/* ---------- render & navigation ---------- */
function setTabbar(tab){
 if(tab===null){tabbar.hidden=true;return}
 tabbar.hidden=false;const order=['cards','calc','photo','notes'];const i=order.indexOf(tab);
 tabbar.querySelectorAll('.tab').forEach(b=>{const on=b.dataset.tab===tab;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 tabind.style.opacity=i<0?'0':'1';if(i>=0)tabind.style.transform=`translateX(${i*100}%)`;
}
function render(anim){
 const top=cur();
 if(top.id==='draft'&&!draftById(top.p)){S.stack=[{id:'cards'}];return render(anim)}
 if((top.id==='cardedit'||top.id==='secedit')&&!S.edit){S.stack=[{id:'cards'},{id:'mycards'}];return render(anim)}
 if(top.id==='note'&&!noteRef(top.p)){S.stack=[{id:'notes'}];return render(anim)}
 if(top.id==='card'&&!card(top.p)){S.stack=[{id:'cards'},{id:'mycards'}];return render(anim)}
 if(top.id==='review'&&!S.review){S.stack=[{id:'cards'}];return render(anim)}
 const def=SCR[top.id](top);
 const old=S.L;
 [...stage.children].forEach(c=>{if(c!==old)c.remove()});
 const L=document.createElement('section');L.className='layer';L.setAttribute('aria-label',def.title||'');L.innerHTML=def.html;
 if(anim==='back'&&old)stage.insertBefore(L,old);else stage.appendChild(L);
 S.L=L;setTabbar(def.tab);updRecBar();phone.dataset.th=S.theme;
 if(old){let a;
  if(anim==='push'){A(L,[{transform:'translateX(100%)'},{transform:'none'}],340);a=A(old,[{transform:'none',opacity:1},{transform:'translateX(-24%)',opacity:.4}],340)}
  else if(anim==='back'){A(L,[{transform:'translateX(-24%)',opacity:.4},{transform:'none',opacity:1}],340);a=A(old,[{transform:'none'},{transform:'translateX(100%)'}],340)}
  else{A(L,[{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'none'}],280);a=A(old,[{opacity:1},{opacity:0}],180)}
  a.onfinish=()=>old.remove();
 }
 afterRender(top.id,L);
}
function refresh(anim){
 const L=S.L;if(!L)return;const top=cur();const def=SCR[top.id](top);
 const bd=L.querySelector('.bd');const st=bd?bd.scrollTop:0;
 L.innerHTML=def.html;const nb=L.querySelector('.bd');if(nb)nb.scrollTop=st;setTabbar(def.tab);updRecBar();
 if(anim)L.querySelectorAll('#recz,.appear').forEach(el=>A(el,[{opacity:0,transform:'translateY(8px) scale(.98)'},{opacity:1,transform:'none'}],280));
 afterRender(top.id,L);
}
function afterRender(id,L){
 if(id==='forming')runForming(L);
 if(S.pop){S.pop=false;const t=L.querySelectorAll('.th');const last=t[t.length-1];if(last)A(last,[{transform:'scale(.3)',opacity:0},{transform:'scale(1.08)',opacity:1,offset:.7},{transform:'none',opacity:1}],420)}
 if(id==='mycards')setTimeout(()=>S.cards.forEach(c=>delete c.fresh),400);
 if(S.hl)setTimeout(()=>{S.hl=null},2700);


}
function push(id,p){S.stack.push({id:id,p:p});render('push')}
function back(){if(S.stack.length>1){S.stack.pop();render('back')}}
function goTab(t){closeOverlay(true);
 if(S.tab===t&&S.stack[0].id===t){if(S.stack.length>1){S.stack=[S.stack[0]];render('back')}return}

function updRecBar(){const b=document.getElementById('recbar');if(!b)return;const on=(S.rec==='rec'||S.rec==='pause')&&cur().id!=='newcard'&&!['offline','forming','login'].includes(cur().id);
 if(!on){b.hidden=true;b.innerHTML='';return}

/* ---------- calculator ---------- */
const toNum=s=>parseFloat(String(s).replace('−','-').replace(',','.'));
function fmtNum(n){if(!isFinite(n))return 'Ошибка';let s=String(parseFloat(n.toPrecision(12)));if(s.includes('e'))s=n.toExponential(5);return s.replace('-','−').replace('.',',')}
const doOp=(a,b,o)=>o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:(b===0?NaN:a/b);
function calcKey(k){
 if(S.calc.cur==='Ошибка'&&k!=='C')S.calc={cur:'0',prev:null,op:null,fresh:false};
 const c=S.calc;
 if(/[0-9]/.test(k)){if(c.fresh||c.cur==='0'){c.cur=k;c.fresh=false}else if(c.cur.replace(/[−,]/g,'').length<12)c.cur+=k}
 else if(k===','){if(c.fresh){c.cur='0,';c.fresh=false}else if(!c.cur.includes(','))c.cur+=','}
 else if(k==='C'){S.calc={cur:'0',prev:null,op:null,fresh:false}}
 else if(k==='±'){if(c.cur!=='0')c.cur=c.cur.startsWith('−')?c.cur.slice(1):'−'+c.cur}
 else if(k==='%'){c.cur=fmtNum(toNum(c.cur)/100);c.fresh=true}
 else if('÷×−+'.includes(k)){if(c.op&&!c.fresh){c.cur=fmtNum(doOp(c.prev,toNum(c.cur),c.op))}c.prev=toNum(c.cur);c.op=k;c.fresh=true}
 else if(k==='='){if(c.op){c.cur=fmtNum(doOp(c.prev,toNum(c.cur),c.op));c.op=null;c.prev=null;c.fresh=true}}
 const L=S.L,o=L.querySelector('#cout');if(!o)return;
 o.textContent=S.calc.cur;o.classList.toggle('small',S.calc.cur.length>9);
 L.querySelector('#cexpr').textContent=calcExpr();
 L.querySelectorAll('.k.op').forEach(b=>b.classList.toggle('act',b.dataset.p===S.calc.op&&S.calc.fresh));
}

 doseCalc(){const d=S.dose;if(!d.drug.trim()||!d.w.trim()){d.err='Укажите препарат и вес животного';d.res=null;refresh();return}
  d.err=null;d.res=`${d.drug.trim()} · ${d.sp.trim()||'вид не указан'} · ${d.w.trim()} кг`;refresh(true)},
 pickPhoto(){shutter(openSaveDialog)},
 toCard(){closeOverlay();push('pickcard')},
 toNotes(){closeOverlay();push('pickfolder')},
 savePhotoCard(id){const c=card(id);c.photos++;S.pop=true;S.tab='cards';S.stack=[{id:'cards'},{id:'mycards'},{id:'card',p:c.id}];render('push');toast(`Фото сохранено в карту «${c.name}»`)},
 savePhotoFolder(id){const f=folder(id);f.photos++;S.pop=true;S.tab='notes';S.stack=[{id:'notes'},{id:'folder',p:f.id}];render('push');toast(`Фото сохранено в «${f.n}»`)},
 addPhotoToCard(id){photoSource(()=>{card(id).photos++;S.pop=true;refresh()})},
 addFolderPhoto(id){shutter(()=>{folder(id).photos++;S.pop=true;refresh();toast('Фото загружено')})},
 addDraftPhoto(){const d=curDraft();photoSource(()=>{d.photos++;S.pop=true;refresh()})},
 newFolder(p){inputSheet({title:'Новая папка',fields:[{k:'n',label:'Название папки',ph:'Например, «Анализы»'}],ok:'Создать',save:v=>{
  const f={id:Date.now(),n:v.n||'Новая папка',photos:p==='photo'?1:0,notes:[]};S.folders.push(f);if(p==='photo')S.pop=true;
  S.tab='notes';S.stack=[{id:'notes'},{id:'folder',p:f.id}];render('push');toast(p==='photo'?'Папка создана, фото сохранено':'Папка создана')}})},
 newNote(fid){inputSheet({title:'Новая заметка',fields:[{k:'t',label:'Текст заметки',area:true,ph:'Что записать?'}],ok:'Сохранить',save:v=>{
  let f=fid?folder(fid):S.folders[0];if(!f){f={id:Date.now(),n:'Общие',photos:0,notes:[]};S.folders.push(f)}
  f.notes.unshift(v.t||'Новая заметка');refresh();toast(`Заметка добавлена в «${f.n}»`)}})},
 newLink(){inputSheet({title:'Новая ссылка',fields:[{k:'t',label:'Название',ph:'Например, «Справочник»'},{k:'u',label:'Адрес',ph:'example.ru',type:'url'}],ok:'Сохранить',save:v=>{
  S.links.push({t:v.t||'Ссылка',u:v.u||'адрес не указан'});refresh();toast('Ссылка сохранена')}})},
 edit(k){const p=S.profile;
  if(k==='pass')return inputSheet({title:'Сменить пароль',fields:[{k:'a',label:'Текущий пароль',type:'password'},{k:'b',label:'Новый пароль',type:'password'}],ok:'Сменить',save:()=>toast('Пароль изменён')});
  const L={name:'Имя',email:'Почта',login:'Логин'}[k];
  inputSheet({title:'Изменить: '+L.toLowerCase(),fields:[{k:'v',label:L,v:p[k],type:k==='email'?'email':'text'}],ok:'Сохранить',save:v=>{if(v.v)p[k]=v.v;refresh();toast('Сохранено')}})},
 renew(){const opt=(n,l)=>`<button class="opt${S.renewN===n?' on':''}" data-act="renewPick" data-p="${n}"><span>${l}</span><span style="display:flex;align-items:center;gap:12px"><span class="s">[цена]</span><span class="rad"></span></span></button>`;
  openOverlay(`<div class="shead"><h2>Продлить подписку</h2><button class="ib" data-act="closeOv" aria-label="Закрыть">${ic('x',22)}</button></div>${opt(1,'1 месяц')}${opt(12,'12 месяцев')}<button class="btn pri" data-act="renewDo">Продлить</button>`)},
 renewPick(n){S.renewN=+n;S.ov.querySelectorAll('.opt').forEach(b=>b.classList.toggle('on',+b.dataset.p===S.renewN))},
 renewDo(){S.profile.until=addMonths(S.profile.until,S.renewN);closeOverlay();refresh();toast('Подписка продлена до '+dmy(S.profile.until))},
 support(){inputSheet({title:'Связаться с поддержкой',fields:[{k:'m',label:'Опишите вопрос',area:true,ph:'Что случилось?'}],ok:'Отправить',save:()=>toast('Сообщение отправлено в поддержку')})},
 logout(){openOverlay(`<h2>Выйти из приложения?</h2><span class="s" style="font-size:15px">Карты и заметки останутся в аккаунте.</span><button class="btn pri" data-act="doLogout">Выйти</button><button class="btn ghost" data-act="closeOv">Отмена</button>`,'modal')},
 doLogout(){closeOverlay();resetRec();S.stack=[{id:'login'}];render('fade')},
 draftContinue(){const d=curDraft();S.tpl=d.tpl;clearInterval(S.tm);S.rec=d.sec?'stop':'idle';S.sec=d.sec;S.cardPhotos=d.photos;S.drafts=S.drafts.filter(x=>x!==d);S.tab='cards';S.stack=[{id:'cards'},{id:'newcard'}];render('push');toast('Черновик открыт для дозаписи')},
 saveDraftCard(){const d=curDraft();S.drafts=S.drafts.filter(x=>x!==d);startForming({photos:d.photos,tpl:d.tpl,sec:d.sec})},
 openDraft(){S.offRet=null;S.tab='cards';S.stack=[{id:'cards'}];render('fade')}
};

/* ---------- events ---------- */
phone.addEventListener('click',e=>{
 const t=e.target.closest('[data-act],[data-go],[data-back],[data-tab]');if(!t||!phone.contains(t))return;
 if(t.dataset.tab){goTab(t.dataset.tab);return}
 if(t.hasAttribute('data-back')){back();return}
 if(t.dataset.go){push(t.dataset.go,t.dataset.p);return}
 const f=ACT[t.dataset.act];if(f)f(t.dataset.p,t);
});
phone.addEventListener('input',e=>{const t=e.target;
 if(t.id==='q')filter(t);
 else if(t.id==='pq')updSug(t.value);
 else if(t.dataset.dk&&S.dis)S.dis[t.dataset.dk]=t.value;
 else if(t.id==='dtext'&&curDraft())curDraft().text=t.value;
 else if(t.id==='setext'&&S.edit)S.edit.secs[+t.dataset.se].v=t.value;
 else if(t.id==='tplName')S.tplName=t.value;
 else if(t.dataset.rk&&S.review)S.review[t.dataset.rk]=t.value;
 else if(t.dataset.ri&&S.review)S.review.secs[+t.dataset.ri].v=t.value;
 else if(t.dataset.k&&S.dose.hasOwnProperty(t.dataset.k))S.dose[t.dataset.k]=t.value;
});
['keyup','compositionend','focusin','search'].forEach(ev=>phone.addEventListener(ev,e=>{if(e.target&&e.target.id==='pq')updSug(e.target.value)}));
phone.addEventListener('change',e=>{const t=e.target;if(t.id!=='tplFile'||!t.files||!t.files[0])return;
 const name=t.files[0].name;S.tplDoc=name;S.tplParsing=true;updTpl(false);
 setTimeout(()=>{S.tplParsing=false;S.tplName=name.replace(/\.[^.]+$/,'');S.newSections=['Анамнез','Осмотр','Диагноз','Назначения'];
  if(cur().id!=='templates'||S.tplTab!=='add')return;updTpl(false);
  S.L.querySelectorAll('.secrow').forEach((r,i)=>A(r,[{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],260,{delay:RM.matches?0:i*70}));
  toast('Разделы взяты из документа')},RM.matches?200:1500)});
phone.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='lg1'||e.target.id==='lg2')){e.preventDefault();ACT.doLogin();return}if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.id.startsWith('is_')&&S.sheetCb){e.preventDefault();S.sheetCb()}
 if(e.key==='Escape'&&S.ov)closeOverlay()});

function sc(name){closeOverlay(true);
 if(name==='restart'){clearInterval(S.tm);S.formTok++;const th=S.theme;S=init();S.theme=th;S.L=stage.lastElementChild;syncEmpty();render('fade');updRecBar();return}
 if(name==='empty'){
  if(!S.emptyMode){S.bk={cards:S.cards,folders:S.folders,links:S.links,drafts:S.drafts};S.cards=[];S.folders=[];S.links=[];S.drafts=[];S.emptyMode=true}
  else{const b=S.bk||{};S.cards=(b.cards||[]).concat(S.cards);S.folders=(b.folders||[]).concat(S.folders);S.links=(b.links||[]).concat(S.links);S.drafts=(b.drafts||[]).concat(S.drafts);S.emptyMode=false}
  syncEmpty();S.formTok++;S.stack=[S.stack[0].id==='login'||S.stack[0].id==='offline'?{id:'cards'}:S.stack[0]];
  if(!['cards','calc','photo','notes'].includes(S.stack[0].id))S.stack=[{id:'cards'}];S.tab=S.stack[0].id;render('fade');return}
 if(name==='bgrec'){S.formTok++;resetRec();S.sec=37;S.rec='rec';startTimer();S.tab='calc';S.stack=[{id:'calc'}];render('fade');return}
 if(name==='huh'){S.formTok++;resetRec();S.rec='huh';S.tab='cards';S.stack=[{id:'cards'},{id:'newcard'}];render('fade');return}
 if(name==='offline'){if(cur().id!=='offline'){S.offRet=S.stack.slice()}S.formTok++;S.stack=[{id:'offline'}];render('fade');return}
 if(name==='offlineCard'){S.formTok++;const sec=S.rec!=='idle'&&S.sec?S.sec:47;
  S.drafts.unshift({id:Date.now(),tpl:S.tpl,sec:sec,photos:S.cardPhotos,text:'',when:nowStr(),net:true});resetRec();S.offRet=[{id:'cards'}];S.stack=[{id:'offline',p:'draft'}];render('fade')}
}
function syncEmpty(){const b=document.getElementById('scEmpty');b.setAttribute('aria-pressed',S.emptyMode?'true':'false')}
function jump(id){closeOverlay(true);S.formTok++;
 const map={cards:['cards'],newcard:['cards','newcard'],mycards:['cards','mycards'],templates:['cards','templates'],draft:['cards','draft'],card:['cards','mycards','card'],trash:['cards','trash'],welcome:['welcome'],calc:['calc'],dosage:['calc','dosage'],photo:['photo'],notes:['notes'],profile:['cards','profile']};
 if(id==='newcard'&&S.rec!=='rec'&&S.rec!=='pause')resetRec();
 if(id==='draft'&&!S.drafts.length)S.drafts.unshift({id:Date.now(),tpl:S.tpl,sec:52,photos:1,text:'',when:nowStr()});
 if(id==='card'&&!S.cards.length){sc('empty')}
 S.stack=map[id].map(x=>({id:x}));S.tab=map[id][0]==='welcome'?'cards':map[id][0];
 if(id==='draft')S.stack[1].p=S.drafts[0].id;
 if(id==='card')S.stack[2].p=S.cards[0].id;
 render('fade')}
document.querySelectorAll('[data-sc]').forEach(b=>b.addEventListener('click',()=>sc(b.dataset.sc)));
document.querySelectorAll('[data-j]').forEach(b=>b.addEventListener('click',()=>jump(b.dataset.j)));

function fit(){const w=document.documentElement.clientWidth-32;const h=window.innerHeight-48;
 const s=Math.min(1,w/412,Math.max(h,620)/866);document.documentElement.style.setProperty('--s',s.toFixed(3))}
window.addEventListener('resize',fit);fit();
render('none');
})();
</script>
